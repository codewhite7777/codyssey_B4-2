<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#ffffff"/>
  <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">교착상태(Deadlock) — 서로가 서로를 기다린다</text>
  <text x="480" y="70" text-anchor="middle" font-size="14" fill="#64748b">둘 다 "상대가 먼저 놓아주면 할게"라고 기다리면, 아무도 움직이지 못한다</text>

  <!-- LEFT: cycle -->
  <g transform="translate(30,96)">
    <rect width="470" height="340" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <!-- locks -->
    <g text-anchor="middle">
      <rect x="175" y="26" width="120" height="54" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
      <text x="235" y="50" font-size="15" font-weight="700" fill="#0f172a">Lock 1</text>
      <text x="235" y="69" font-size="11.5" fill="#64748b">자원 1 (열쇠)</text>
      <rect x="175" y="262" width="120" height="54" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
      <text x="235" y="286" font-size="15" font-weight="700" fill="#0f172a">Lock 2</text>
      <text x="235" y="305" font-size="11.5" fill="#64748b">자원 2 (열쇠)</text>
      <!-- threads -->
      <rect x="22" y="144" width="122" height="56" rx="28" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
      <text x="83" y="169" font-size="15" font-weight="700" fill="#5b21b6">Thread A</text>
      <text x="83" y="187" font-size="11.5" fill="#6d28d9">BLOCKED</text>
      <rect x="326" y="144" width="122" height="56" rx="28" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
      <text x="387" y="169" font-size="15" font-weight="700" fill="#5b21b6">Thread B</text>
      <text x="387" y="187" font-size="11.5" fill="#6d28d9">BLOCKED</text>
    </g>
    <!-- holds: lock -> thread (green solid) -->
    <path d="M175,60 C110,64 84,100 83,140" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#g)"/>
    <path d="M295,290 C360,286 386,250 387,204" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#g)"/>
    <!-- waits: thread -> lock (red dashed) -->
    <path d="M83,204 C84,250 110,286 171,290" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#r)"/>
    <path d="M387,140 C386,100 360,64 299,60" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#r)"/>
    <g font-size="12.5">
      <text x="18" y="100" fill="#059669" font-weight="700">① 1 획득</text>
      <text x="394" y="258" fill="#059669" font-weight="700">② 2 획득</text>
      <text x="30" y="318" fill="#dc2626" font-weight="700">③ 2 기다림…</text>
      <text x="396" y="100" fill="#dc2626" font-weight="700">④ 1 기다림…</text>
    </g>
    <path d="M253,160 A18,18 0 1 1 235,142" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/>
    <text x="235" y="194" text-anchor="middle" font-size="12.5" fill="#dc2626" font-weight="700">순환 대기</text>
    <g font-size="12" fill="#475569">
      <line x1="300" y1="326" x2="326" y2="326" stroke="#059669" stroke-width="3"/><text x="332" y="330">가지고 있음</text>
      <line x1="300" y1="310" x2="326" y2="310" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4"/><text x="332" y="314">기다리는 중</text>
    </g>
  </g>

  <!-- RIGHT: 4 conditions -->
  <g transform="translate(520,96)">
    <rect width="410" height="340" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="205" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">데드락 4가지 조건 (4개 모두 성립 시 발생)</text>
    <g font-size="13">
      <rect x="20" y="50" width="370" height="62" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
      <text x="36" y="75" font-weight="700" fill="#5b21b6">① 상호 배제 (Mutual Exclusion)</text>
      <text x="36" y="98" fill="#334155">열쇠 하나는 한 번에 한 스레드만 쥘 수 있다</text>
      <rect x="20" y="120" width="370" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="36" y="145" font-weight="700" fill="#334155">② 점유 대기 (Hold and Wait)</text>
      <text x="36" y="168" fill="#334155">하나를 쥔 채로 다른 하나를 기다린다</text>
      <rect x="20" y="190" width="370" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="36" y="215" font-weight="700" fill="#334155">③ 비선점 (No Preemption)</text>
      <text x="36" y="238" fill="#334155">남이 쥔 열쇠를 강제로 빼앗을 수 없다</text>
      <rect x="20" y="260" width="370" height="62" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
      <text x="36" y="285" font-weight="700" fill="#5b21b6">④ 순환 대기 (Circular Wait)</text>
      <text x="36" y="308" fill="#334155">A → B → A 처럼 기다림이 원을 이룬다</text>
    </g>
  </g>

  <g transform="translate(30,454)" font-size="14">
    <rect width="440" height="86" rx="12" fill="#fffbeb" stroke="#fde68a"/>
    <text x="20" y="30" font-weight="700" fill="#92400e">쉬운 비유</text>
    <text x="20" y="54" fill="#334155">좁은 골목에서 마주친 두 차가 서로 "네가 먼저 빼"</text>
    <text x="20" y="74" fill="#334155">→ 둘 다 시동은 켜져 있는데(PID 있음) 영원히 못 간다</text>
  </g>
  <g transform="translate(490,454)" font-size="14">
    <rect width="440" height="86" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="20" y="30" font-weight="700" fill="#047857">MULTI_THREAD_ENABLE=false 가 통하는 이유</text>
    <text x="20" y="54" fill="#334155">스레드가 하나뿐이면 "서로" 기다릴 상대가 없다</text>
    <text x="20" y="74" fill="#334155">→ ④ 순환 대기가 만들어질 수 없음 → 데드락 X</text>
  </g>
</svg>
