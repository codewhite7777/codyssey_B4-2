<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="960" height="540" rx="16" fill="#ffffff"/>
  <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">CPU 과점유(CPU Spike) → Watchdog 종료</text>
  <text x="480" y="70" text-anchor="middle" font-size="14" fill="#64748b">한 프로세스가 CPU를 독차지하면, 나머지 프로세스는 줄 서서 기다린다 (= 시스템 지연)</text>

  <!-- LEFT: queue -->
  <g transform="translate(30,96)">
    <rect width="380" height="330" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="190" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">CPU 코어 = 계산대</text>
    <!-- CPU box -->
    <rect x="30" y="60" width="140" height="120" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="88" text-anchor="middle" font-size="13" fill="#92400e" font-weight="700">CPU</text>
    <rect x="48" y="102" width="104" height="58" rx="8" fill="#f59e0b"/>
    <text x="100" y="127" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="700">agent-leak-app</text>
    <text x="100" y="146" text-anchor="middle" font-size="12" fill="#fff">사용 중 ~100%</text>
    <!-- queue -->
    <text x="270" y="72" text-anchor="middle" font-size="13" fill="#64748b">실행 대기열 (Run Queue)</text>
    <g font-size="12.5" text-anchor="middle">
      <rect x="210" y="84" width="120" height="30" rx="15" fill="#e2e8f0"/><text x="270" y="104" fill="#334155">sshd · 대기</text>
      <rect x="210" y="120" width="120" height="30" rx="15" fill="#e2e8f0"/><text x="270" y="140" fill="#334155">웹서버 · 대기</text>
      <rect x="210" y="156" width="120" height="30" rx="15" fill="#e2e8f0"/><text x="270" y="176" fill="#334155">monitor.sh · 대기</text>
    </g>
    <line x1="205" y1="134" x2="176" y2="122" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#a)"/>
    <rect x="30" y="206" width="320" height="104" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="48" y="234" font-size="13.5" fill="#0f172a" font-weight="700">결과</text>
    <text x="48" y="258" font-size="13" fill="#334155">· 터미널 입력이 늦게 반응한다</text>
    <text x="48" y="280" font-size="13" fill="#334155">· 다른 서비스의 응답 시간이 늘어난다</text>
    <text x="48" y="302" font-size="13" fill="#334155" dy="-2">· 전체 부하가 아니라 "한 프로세스"가 범인</text>
  </g>

  <!-- RIGHT: chart -->
  <g transform="translate(430,96)">
    <rect width="500" height="330" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="250" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">시간에 따른 CPU 사용률</text>
    <line x1="56" y1="290" x2="470" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="56" y1="290" x2="56" y2="52" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="462" y="314" font-size="12" fill="#64748b" text-anchor="end">시간 →</text>
    <text x="48" y="60" font-size="12" fill="#64748b" text-anchor="end">%</text>
    <text x="48" y="80" font-size="11" fill="#94a3b8" text-anchor="end">100</text>
    <!-- threshold -->
    <line x1="56" y1="170" x2="460" y2="170" stroke="#ef4444" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="458" y="162" text-anchor="end" font-size="12.5" fill="#b91c1c" font-weight="700">CPU_MAX_OCCUPY (임계치)</text>
    <!-- usage -->
    <polyline points="56,272 110,268 150,270 175,260 200,120 230,84 260,80 290,82" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="200" y="74" width="92" height="96" fill="#fca5a5" opacity=".25"/>
    <text x="246" y="66" text-anchor="middle" font-size="12" fill="#b91c1c">초과 구간</text>
    <g stroke="#b91c1c" stroke-width="4" stroke-linecap="round"><line x1="282" y1="72" x2="298" y2="88"/><line x1="298" y1="72" x2="282" y2="88"/></g>
    <rect x="308" y="190" width="170" height="62" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="393" y="212" text-anchor="middle" font-size="12.5" fill="#b91c1c" font-weight="700">Watchdog</text>
    <text x="393" y="230" text-anchor="middle" font-size="12" fill="#b91c1c">임계치를 넘으면</text>
    <text x="393" y="246" text-anchor="middle" font-size="12" fill="#b91c1c">SIGTERM으로 종료</text>
    <text x="80" y="258" font-size="12" fill="#92400e">평소</text>
    <text x="150" y="150" font-size="12" fill="#92400e">급상승!</text>
  </g>

  <g transform="translate(30,444)" font-size="14">
    <rect width="440" height="76" rx="12" fill="#fffbeb" stroke="#fde68a"/>
    <text x="20" y="30" font-weight="700" fill="#92400e">쉬운 비유</text>
    <text x="20" y="54" fill="#334155">마트 계산대를 한 손님이 오래 붙잡고 있으면</text>
    <text x="20" y="72" fill="#334155" dy="-2">뒤에 줄 선 손님 전원이 늦어진다</text>
  </g>
  <g transform="translate(490,444)" font-size="14">
    <rect width="440" height="76" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="20" y="30" font-weight="700" fill="#1e40af">왜 그 프로세스 하나만 끄나?</text>
    <text x="20" y="54" fill="#334155">범인 하나만 정리하면 나머지는 정상으로 돌아온다</text>
    <text x="20" y="72" fill="#334155" dy="-2">서버 전체 재부팅보다 피해가 훨씬 작다</text>
  </g>
</svg>
