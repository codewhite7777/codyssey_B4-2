<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1090" width="1200" height="1090" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>

    <!-- reusable pieces of the mini diagram (origin = row top-left) -->
    <g id="res">
      <rect x="880" y="35" width="150" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
      <text x="955" y="61" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">A  Shared_Memory</text>
      <rect x="880" y="162" width="150" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
      <text x="955" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">B  Socket_Pool</text>
    </g>
    <g id="thr">
      <rect x="765" y="96" width="110" height="44" rx="22" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
      <text x="820" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Thread-1</text>
      <rect x="1035" y="96" width="110" height="44" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="1090" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Thread-2</text>
    </g>
    <g id="hold">
      <line x1="838" y1="96" x2="882" y2="66" stroke="#059669" stroke-width="4"/>
      <text x="826" y="78" font-size="12" font-weight="700" fill="#059669" text-anchor="end">쥠</text>
      <line x1="1072" y1="140" x2="1028" y2="170" stroke="#2563eb" stroke-width="4"/>
      <text x="1084" y="166" font-size="12" font-weight="700" fill="#2563eb">쥠</text>
    </g>
  </defs>

  <rect width="1200" height="1090" rx="16" fill="#ffffff"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#0f172a">로그 한 줄씩 → 그림 한 칸씩: 데드락이 만들어진 3단계</text>
  <text x="40" y="76" font-size="14" fill="#64748b">logs/3_deadlock_app.log 의 실제 로그 (앞부분 [INFO] [AgentWorker] 는 줄임) · 왼쪽 로그가 오른쪽 그림의 어느 선이 되는지 같은 색으로 표시</text>

  <text x="50" y="118" font-size="13" font-weight="700" fill="#64748b">앱 로그</text>
  <text x="765" y="118" font-size="13" font-weight="700" fill="#64748b">그 순간의 상태</text>

  <!-- ================= ROW 1 ================= -->
  <g transform="translate(0,130)">
    <rect x="30" y="0" width="1140" height="230" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="62" cy="32" r="16" fill="#059669"/><text x="62" y="38" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
    <text x="88" y="38" font-size="17" font-weight="700" fill="#0f172a">각자 자원을 하나씩 잡음</text>
    <text x="690" y="38" font-size="13" fill="#64748b" text-anchor="end">16:13:40.742 ~ .743</text>
    <rect x="50" y="56" width="640" height="76" rx="8" fill="#1e293b"/>
    <g font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#e2e8f0">
      <text x="64" y="86">40,742 [<tspan fill="#34d399" font-weight="700">Worker-Thread-1</tspan>] <tspan fill="#fde68a" font-weight="700">LOCK ACQUIRED</tspan>: [Shared_Memory_A]</text>
      <text x="64" y="116">40,743 [<tspan fill="#60a5fa" font-weight="700">Worker-Thread-2</tspan>] <tspan fill="#fde68a" font-weight="700">LOCK ACQUIRED</tspan>: [Socket_Pool_B]</text>
    </g>
    <text x="52" y="168" font-size="14.5" fill="#0f172a">Thread-1은 <tspan font-weight="700">A</tspan>를, Thread-2는 <tspan font-weight="700">B</tspan>를 잡았다. 각자 하나씩이라 아직은 문제없다.</text>
    <text x="52" y="196" font-size="13.5" fill="#6d28d9"><tspan font-weight="700">상호 배제</tspan> · 자원 하나는 한 번에 한 스레드만 쥘 수 있다</text>
    <line x1="702" y1="115" x2="752" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#ak)"/>
    <use href="#res"/><use href="#thr"/><use href="#hold"/>
  </g>

  <!-- ================= ROW 2 ================= -->
  <g transform="translate(0,375)">
    <rect x="30" y="0" width="1140" height="230" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="62" cy="32" r="16" fill="#f59e0b"/><text x="62" y="38" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
    <text x="88" y="38" font-size="17" font-weight="700" fill="#0f172a">쥔 것을 놓지 않은 채, 상대가 쥔 것을 요청</text>
    <text x="690" y="38" font-size="13" fill="#64748b" text-anchor="end">16:13:42.758</text>
    <rect x="50" y="56" width="640" height="76" rx="8" fill="#1e293b"/>
    <g font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#e2e8f0">
      <text x="64" y="86">42,758 [<tspan fill="#34d399" font-weight="700">Worker-Thread-1</tspan>] <tspan fill="#fdba74" font-weight="700">Need resource</tspan> [Socket_Pool_B]</text>
      <text x="64" y="116">42,758 [<tspan fill="#60a5fa" font-weight="700">Worker-Thread-2</tspan>] <tspan fill="#fdba74" font-weight="700">Need resource</tspan> [Shared_Memory_A]</text>
    </g>
    <text x="52" y="168" font-size="14.5" fill="#0f172a">일을 끝내려면 Thread-1은 <tspan font-weight="700">B</tspan>가, Thread-2는 <tspan font-weight="700">A</tspan>가 더 필요해졌다.</text>
    <text x="52" y="196" font-size="13.5" fill="#6d28d9"><tspan font-weight="700">점유 대기</tspan> · 하나를 쥔 채로 다른 하나를 요청한다</text>
    <line x1="702" y1="115" x2="752" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#ak)"/>
    <use href="#res"/><use href="#thr"/><use href="#hold"/>
    <line x1="838" y1="140" x2="878" y2="166" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#ao)"/>
    <line x1="1072" y1="96" x2="1032" y2="70" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#ao)"/>
    <text x="826" y="168" font-size="12" font-weight="700" fill="#b45309" text-anchor="end">필요</text>
    <text x="1084" y="78" font-size="12" font-weight="700" fill="#b45309">필요</text>
  </g>

  <!-- ================= ROW 3 ================= -->
  <g transform="translate(0,620)">
    <rect x="30" y="0" width="1140" height="230" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
    <circle cx="62" cy="32" r="16" fill="#dc2626"/><text x="62" y="38" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
    <text x="88" y="38" font-size="17" font-weight="700" fill="#0f172a">둘 다 상대가 놓기를 기다리며 잠듦 → 원이 닫힘 = 데드락</text>
    <text x="690" y="38" font-size="13" fill="#64748b" text-anchor="end">16:13:42.760</text>
    <rect x="50" y="56" width="640" height="76" rx="8" fill="#1e293b"/>
    <g font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#e2e8f0">
      <text x="64" y="86">42,760 [<tspan fill="#34d399" font-weight="700">Worker-Thread-1</tspan>] <tspan fill="#fca5a5" font-weight="700">WAITING</tspan> [Socket_Pool_B] <tspan fill="#fca5a5" font-weight="700">BLOCKED</tspan></text>
      <text x="64" y="116">42,760 [<tspan fill="#60a5fa" font-weight="700">Worker-Thread-2</tspan>] <tspan fill="#fca5a5" font-weight="700">WAITING</tspan> [Shared_Memory_A] <tspan fill="#fca5a5" font-weight="700">BLOCKED</tspan></text>
    </g>
    <text x="52" y="168" font-size="14.5" fill="#0f172a">Thread-1이 기다리는 B는 Thread-2가, Thread-2가 기다리는 A는 Thread-1이 쥐고 있다.</text>
    <text x="52" y="196" font-size="13.5" fill="#6d28d9"><tspan font-weight="700">순환 대기</tspan> · Thread-1 → B → Thread-2 → A → Thread-1 (누구도 먼저 놓지 않음 = <tspan font-weight="700">비선점</tspan>)</text>
    <line x1="702" y1="115" x2="752" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#ak)"/>
    <use href="#res"/><use href="#thr"/><use href="#hold"/>
    <line x1="838" y1="140" x2="878" y2="166" stroke="#dc2626" stroke-width="4" stroke-dasharray="7 5" marker-end="url(#ar)"/>
    <line x1="1072" y1="96" x2="1032" y2="70" stroke="#dc2626" stroke-width="4" stroke-dasharray="7 5" marker-end="url(#ar)"/>
    <text x="826" y="168" font-size="12" font-weight="700" fill="#dc2626" text-anchor="end">기다림</text>
    <text x="1084" y="78" font-size="12" font-weight="700" fill="#dc2626">기다림</text>
    <rect x="890" y="104" width="130" height="28" rx="14" fill="#dc2626"/>
    <text x="955" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">원이 닫힘</text>
  </g>

  <!-- ================= RESULT ================= -->
  <g transform="translate(0,865)">
    <rect x="30" y="0" width="1140" height="205" rx="14" fill="#0f172a"/>
    <text x="56" y="38" font-size="17" font-weight="700" fill="#ffffff">그 뒤 12분 29초 동안 무슨 일이 있었나</text>
    <g font-size="14.5" fill="#e2e8f0">
      <text x="56" y="76"><tspan fill="#fca5a5" font-weight="700">앱 로그</tspan>    16:13:42.760 이후 <tspan font-weight="700">0줄</tspan> → 16:26:11 사람이 Ctrl+C</text>
      <text x="56" y="106"><tspan fill="#fca5a5" font-weight="700">OS 측정</tspan>    스레드 3개 모두 S(잠든 채 기다림) · CPU 0.0% · TIME+ 0:00.00 · RSS 17MB 그대로</text>
      <text x="56" y="136"><tspan fill="#fca5a5" font-weight="700">monitor.sh</tspan>  LOG_AGE(로그가 멈춘 시간) 2초 → 748초, 0으로 다시 돌아가지 않음</text>
    </g>
    <text x="56" y="180" font-size="14.5" fill="#fde68a">왜 안 풀리나 → 잠금을 놓아 깨워 줘야 할 상대도 잠들어 있다. 메인 스레드도 일꾼 둘이 끝나기를 기다리다 함께 멈췄다.</text>
  </g>
</svg>
