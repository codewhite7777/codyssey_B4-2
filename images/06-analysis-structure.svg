<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1200" height="560" rx="16" fill="#ffffff"/>
  <text x="40" y="50" font-size="24" font-weight="700" fill="#0f172a">어떻게 분석했나 — 질문 5개로 나눠서 하나씩 풀었다</text>
  <text x="40" y="78" font-size="14" fill="#64748b">각 단계는 앞 단계의 결과를 근거로 다음 질문을 정했다</text>

  <!-- row labels -->
  <g font-size="13" font-weight="700" fill="#64748b">
    <text x="40" y="196">궁금했던 것</text>
    <text x="40" y="314">한 일</text>
    <text x="40" y="430">남긴 결과물</text>
  </g>

  <!-- 5 columns -->
  <g font-size="13.5" text-anchor="middle">
    <!-- col 1 -->
    <g transform="translate(150,104)">
      <circle cx="95" cy="16" r="16" fill="#334155"/><text x="95" y="22" fill="#fff" font-weight="700">1</text>
      <text x="95" y="56" font-size="16" font-weight="700" fill="#0f172a">앱 파악</text>
      <rect x="0" y="70" width="190" height="56" rx="10" fill="#f1f5f9"/>
      <text x="95" y="94" fill="#0f172a" font-weight="700">이 앱은 무엇을 하나?</text>
      <text x="95" y="114" fill="#64748b" font-size="12">문서에는 조건만 있었다</text>
      <rect x="0" y="146" width="190" height="124" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="95" y="172" fill="#334155">직접 실행해 보기</text>
      <text x="95" y="196" fill="#334155" font-size="12.5">부팅 검사 6단계 확인</text>
      <text x="95" y="218" fill="#334155" font-size="12.5">값에 따라 시나리오가 바뀜</text>
      <text x="95" y="240" fill="#334155" font-size="12.5">프로세스 2개 (부모·자식)</text>
      <rect x="0" y="290" width="190" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="95" y="316" fill="#0f172a" font-weight="700" font-size="13">수행과정.md §1</text>
      <text x="95" y="336" fill="#64748b" font-size="12">스크린샷 0-1 ~ 0-3</text>
    </g>
    <!-- col 2 -->
    <g transform="translate(360,104)">
      <circle cx="95" cy="16" r="16" fill="#2563eb"/><text x="95" y="22" fill="#fff" font-weight="700">2</text>
      <text x="95" y="56" font-size="16" font-weight="700" fill="#0f172a">관제 준비</text>
      <rect x="0" y="70" width="190" height="56" rx="10" fill="#eff6ff"/>
      <text x="95" y="94" fill="#0f172a" font-weight="700">무엇을 재야 하나?</text>
      <text x="95" y="114" fill="#64748b" font-size="12">잘못 재면 원인이 안 보인다</text>
      <rect x="0" y="146" width="190" height="124" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="95" y="172" fill="#334155">monitor.sh 만들기</text>
      <text x="95" y="196" fill="#334155" font-size="12.5">부모가 아닌 자식 PID</text>
      <text x="95" y="218" fill="#334155" font-size="12.5">RSS · 순간 CPU · 스레드</text>
      <text x="95" y="240" fill="#334155" font-size="12.5">LOG_AGE (로그 멈춘 시간)</text>
      <rect x="0" y="290" width="190" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="95" y="316" fill="#0f172a" font-weight="700" font-size="13">bin/monitor.sh</text>
      <text x="95" y="336" fill="#64748b" font-size="12">1초 간격 기록</text>
    </g>
    <!-- col 3 -->
    <g transform="translate(570,104)">
      <circle cx="95" cy="16" r="16" fill="#2563eb"/><text x="95" y="22" fill="#fff" font-weight="700">3</text>
      <text x="95" y="56" font-size="16" font-weight="700" fill="#0f172a">실험 설계</text>
      <rect x="0" y="70" width="190" height="56" rx="10" fill="#eff6ff"/>
      <text x="95" y="94" fill="#0f172a" font-weight="700">원인을 어떻게 증명하나?</text>
      <text x="95" y="114" fill="#64748b" font-size="12">여러 값을 바꾸면 헷갈린다</text>
      <rect x="0" y="146" width="190" height="124" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="95" y="172" fill="#334155">값 하나만 바꾸기</text>
      <text x="95" y="196" fill="#334155" font-size="12.5">정상 기준: 512 / 40 / false</text>
      <text x="95" y="218" fill="#334155" font-size="12.5">장애마다 1개만 바꿈</text>
      <text x="95" y="240" fill="#334155" font-size="12.5">실행 4번 (장애 3 + 정상 1)</text>
      <rect x="0" y="290" width="190" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="95" y="316" fill="#0f172a" font-weight="700" font-size="13">logs/ 8개</text>
      <text x="95" y="336" fill="#64748b" font-size="12">스크린샷 1-1 ~ 4-2</text>
    </g>
    <!-- col 4 -->
    <g transform="translate(780,104)">
      <circle cx="95" cy="16" r="16" fill="#f59e0b"/><text x="95" y="22" fill="#fff" font-weight="700">4</text>
      <text x="95" y="56" font-size="16" font-weight="700" fill="#0f172a">교차 확인</text>
      <rect x="0" y="70" width="190" height="56" rx="10" fill="#fffbeb"/>
      <text x="95" y="94" fill="#0f172a" font-weight="700">앱의 말이 사실인가?</text>
      <text x="95" y="114" fill="#64748b" font-size="12">로그 하나만 믿지 않는다</text>
      <rect x="0" y="146" width="190" height="124" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="95" y="172" fill="#334155">앱 로그 × OS 측정값</text>
      <text x="95" y="196" fill="#059669" font-size="12.5">메모리: 일치</text>
      <text x="95" y="218" fill="#dc2626" font-size="12.5">CPU: 51% vs 0~10% 불일치</text>
      <text x="95" y="240" fill="#334155" font-size="12.5">데드락: PID 있음 + CPU 0</text>
      <rect x="0" y="290" width="190" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="95" y="316" fill="#0f172a" font-weight="700" font-size="13">실측 그래프 3장</text>
      <text x="95" y="336" fill="#64748b" font-size="12">images/chart_*</text>
    </g>
    <!-- col 5 -->
    <g transform="translate(990,104)">
      <circle cx="85" cy="16" r="16" fill="#059669"/><text x="85" y="22" fill="#fff" font-weight="700">5</text>
      <text x="85" y="56" font-size="16" font-weight="700" fill="#0f172a">기록</text>
      <rect x="0" y="70" width="170" height="56" rx="10" fill="#ecfdf5"/>
      <text x="85" y="94" fill="#0f172a" font-weight="700">동료가 읽고 알 수 있나?</text>
      <text x="85" y="114" fill="#64748b" font-size="12">증거 없는 결론은 없다</text>
      <rect x="0" y="146" width="170" height="124" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="85" y="172" fill="#334155">GitHub Issue 형식</text>
      <text x="85" y="196" fill="#334155" font-size="12.5">현상 → 증거</text>
      <text x="85" y="218" fill="#334155" font-size="12.5">→ 원인 → 조치</text>
      <text x="85" y="240" fill="#334155" font-size="12.5">PID · 시각 · 로그 첨부</text>
      <rect x="0" y="290" width="170" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="85" y="316" fill="#0f172a" font-weight="700" font-size="13">reports/ 3건</text>
      <text x="85" y="336" fill="#64748b" font-size="12">evaluation.md</text>
    </g>
  </g>

  <!-- arrows between columns (at title row) -->
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#a)">
    <line x1="342" y1="120" x2="356" y2="120"/>
    <line x1="552" y1="120" x2="566" y2="120"/>
    <line x1="762" y1="120" x2="776" y2="120"/>
    <line x1="972" y1="120" x2="986" y2="120"/>
  </g>

  <!-- bottom note -->
  <rect x="40" y="486" width="1120" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="518" font-size="14" fill="#334155"><tspan font-weight="700" fill="#0f172a">핵심 원칙</tspan>   재부팅부터 하지 않는다 · 값은 한 번에 하나만 바꾼다 · 앱의 말과 OS의 측정을 함께 본다 · 본 것만 적는다</text>
</svg>
